<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Fichas VtM V5</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="container">
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>

        <aside class="sidebar" id="sidebar">
            <h2>Fichas VtM V5</h2>
            <div class="menu-item" onclick="switchTab(1)">Prisma</div>
            <div class="menu-item" onclick="switchTab(2)">Cora</div>
            <div class="menu-item" onclick="switchTab(3)">Lu Chen</div>
            <div class="menu-item" onclick="switchTab(4)">Todi Tooka</div>
            <div class="menu-item" onclick="switchTab(5)">Surpresa</div>
            <div class="menu-item active" onclick="switchTab(6)">Visão Geral</div>
        </aside>

        <main class="main-content">
            <div class="save-status" id="saveStatus">✓ Salvo!</div>

            <div class="form-section" id="form1">
                <div class="form-header">
                    <h1>Ficha Prisma</h1>
                    <button class="dice-button" onclick="rollDice()" title="Rolar Dado">
                        <img src="images/dado-imagem.png" alt="Dado">
                    </button>
                </div>
                <!-- Form content remains the same as original -->
                <!-- ... (keeping the existing form structure) ... -->
            </div>

            <!-- ... (all other form sections remain the same) ... -->

            <div class="form-section active" id="form6">
                <div class="form-header">
                    <h1>Visão Geral - Todas as Fichas</h1>
                    <button class="dice-button" onclick="rollDice()" title="Rolar Dado">
                        <img src="images/dado-imagem.png" alt="Dado">
                    </button>
                </div>
                <div class="overview-grid" id="overviewGrid"></div>
            </div>
        </main>
    </div>

    <div class="dice-overlay" id="diceOverlay"></div>
    <div class="dice-result" id="diceResult">
        <h3>Resultado da Rolagem</h3>
        <div class="dice-result-value" id="diceResultValue">10</div>
        <button onclick="closeDiceResult()">Fechar</button>
    </div>

    <div id="diceSelectorOverlay" class="dice-overlay"></div>
    <div id="diceSelector" class="dice-result" style="display:none; min-width:350px;">
        <h3>Selecione o dado</h3>

        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:20px;">
            <button onclick="rollSelectedDice(20)">D20</button>
            <button onclick="rollSelectedDice(12)">D12</button>
            <button onclick="rollSelectedDice(10)">D10</button>
            <button onclick="rollSelectedDice(8)">D8</button>
            <button onclick="rollSelectedDice(6)">D6</button>
        </div>

        <button style="margin-top:25px;" onclick="closeDiceSelector()">Fechar</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
